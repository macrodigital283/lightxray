{{define "login"}}<!doctype html>
<html lang="en">
<head>
  {{template "_head" .}}
  <title>login — lightxray</title>
</head>
<body class="login-page">
  <main class="login-card">
    <h1>lightxray</h1>
    <p class="host">{{.Host}}</p>
    {{if .Error}}<p class="flash error">{{.Error}}</p>{{end}}
    <form method="post" action="{{.Prefix}}/ui/login" autocomplete="off">
      <label>
        <span>Admin UUID</span>
        <input name="admin_uuid" type="password" autofocus required spellcheck="false">
      </label>
      <button type="submit">Log in</button>
    </form>
  </main>
</body>
</html>
{{end}}
