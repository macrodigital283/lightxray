{{- /* Login page — no nav / no host pill, just the form. */ -}}
{{define "login.html"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>login — lightxray</title>
  <link rel="stylesheet" href="{{.Prefix}}/ui/static/style.css">
</head>
<body class="login-page">
  <main class="login-card">
    <h1>lightxray</h1>
    <p class="host">{{.Host}}</p>
    {{if .Error}}<p class="flash error">{{.Error}}</p>{{end}}
    <form method="post" action="{{.Prefix}}/ui/login" autocomplete="off">
      <label>
        <span>Admin UUID</span>
        <input name="admin_uuid" type="password" autofocus required spellcheck="false">
      </label>
      <button type="submit">Log in</button>
    </form>
  </main>
</body>
</html>
{{end}}
